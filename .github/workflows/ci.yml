name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        exclude:
          # Laravel 12 требует PHP 8.2+
          - php: '8.1'
            laravel: '12'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, gmp
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/queue:^${{ matrix.laravel }}.0" "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.laravel }}.0" --no-interaction --no-progress
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: php -d memory_limit=-1 vendor/bin/phpstan analyse --memory-limit=-1
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Run PHPUnit
        run: composer run test
