name: Publish Wiki

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/sync-wiki.sh"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wiki pages
        run: bash scripts/sync-wiki.sh

      - name: Push to GitHub Wiki
        env:
          GH_WIKI_PAT: ${{ secrets.GH_WIKI_PAT }}
        run: |
          if [ -z "${GH_WIKI_PAT}" ]; then
            echo "GH_WIKI_PAT is not set. Add it in repository secrets." >&2
            exit 1
          fi

          git clone "https://x-access-token:${GH_WIKI_PAT}@github.com/${{ github.repository }}.wiki.git" wiki-repo

          rsync -av --delete .wiki/ wiki-repo/

          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "docs: sync wiki from docs/" || {
            echo "No changes to commit";
            exit 0;
          }

          git push
